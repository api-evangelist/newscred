  source: openapi/newscred-cmp-open-api-openapi.json
- id: oidc
  conforms: partial
  evidence: >-
    The openid and profile scopes are offered and a userinfo endpoint
    (https://accounts.cmp.optimizely.com/o/oauth2/v1/userinfo) is documented, which is OIDC-shaped.
    But no openIdConnect securityScheme is declared, no openIdConnectUrl is given, and
    /.well-known/openid-configuration returns 404 on accounts.cmp.optimizely.com — so an OIDC
    client cannot discover the provider. Scored partial, not conformant.
  source: well-known/newscred-well-known.yml
