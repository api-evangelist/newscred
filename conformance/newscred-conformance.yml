domain_standards:
  market: content marketing platform / marketing resource management / digital asset management
  declared: []
  note: >-
    REWARD-ONLY CHECK, HONEST ZERO. The contract declares no domain standard for its market. Probed
    for and did not find: SCIM schema URNs (user/team provisioning), OData $metadata, IPTC or XMP
    embedded-metadata vocabularies (the obvious DAM candidates), Dublin Core, oEmbed as a served
    surface, ActivityPub, and OpenRTB. The nearest thing to an interop standard in the surface is
    GraphQL, and it is not native: the 2026-08-20 changelog added POST
    /content-graphs/{cg_instance_id}/query, which PROXIES a GraphQL query to an Optimizely Graph
    instance and returns the Graph response unchanged. Those two operations are not yet present in
    the harvested spec snapshot. Nothing here is invented to fill the slot.
