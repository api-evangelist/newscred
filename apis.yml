- aid: newscred:newscred-tasks-api
  name: Newscred Tasks API
  description: >-
    Facilitates the integration of external systems with Optimizely CMP through the following use cases:

    1. **External Work Management** – Use the endpoints to link Optimizely CMP with an external system
    (such as Jira or Aha). The external system can send status updates back to Optimizely CMP so that
    the Optimizely CMP user receives in-app updates for the status of the 'ticket' in the external system.

    2. **External Document Approval** – (a.k.a. Marketing Legal Review) Use the endpoints to link Optimizely
    CMP with an external system (such as Veeva PromoMats) to review, annotate, update, and approve marketing
    assets through the external system. The approval status can be sent back to Optimizely CMP so that
    the Optimizely CMP user receives in-app updates for the final approval status of the documents from
    the external system.

    For information on these use cases, contact Optimizely CMP Support.
  humanURL: >-
    https://docs.developers.optimizely.com/content-marketing-platform/reference/api-reference
  baseURL: https://api.cmp.optimizely.com/v3
