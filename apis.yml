- name: Welcome Open API v3 (legacy)
  description: >-
    The prior-generation Newscred/Welcome Open API, published verbatim by the newscred GitHub
    organization. 31 paths / 48 operations across Uploader, Library, Labels, Tasks, Campaigns, Users
    and Settings. Its own description records the base-URL lineage: api.newscred.com/v3 ->
    api.welcomesoftware.com/v3 from 28 March 2021. Still documented as functional; superseded by the
    Optimizely CMP Open API.
  humanURL: https://newscred.github.io/settings-ex-im-automation-sample/openapi.html
