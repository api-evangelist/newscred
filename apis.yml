aid: newscred
name: Newscred
description: >-
  Newscred is the content marketing platform company that began as a licensed-content syndication
  API and grew into an enterprise Content Marketing Platform (CMP), Marketing Resource Management
  and Digital Asset Management suite. The company rebranded to Welcome in 2020 after Industry Dive
  acquired its content-services business, and Optimizely acquired Welcome in December 2021, where
  the product now ships as Optimizely Content Marketing Platform. The API lineage is continuous and
  the vendor documents it: the Open API base URL moved from https://api.newscred.com/v3 to
  https://api.welcomesoftware.com/v3 (28 March 2021) to https://api.cmp.optimizely.com/v3, and CMP
  still requires customers to allowlist *.newscred.com. The public contract is a 170-operation
  OAuth 2.0 REST API published by the newscred GitHub organization, covering library and digital
  asset management, tasks and workflows, campaigns, publishing, structured content, work requests,
  templates, teams and settings, plus a webhook event surface.
