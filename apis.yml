- name: Optimizely CMP Open API v3
  description: >-
    The current Newscred/Welcome content marketing platform REST API, shipping as the Optimizely CMP
    Open API. 115 paths / 170 operations across Library, Uploader, Labels, Brand Compliance, Tasks,
    Task Step, Campaigns, Publishing, Templates, Users, Work Requests, Structured Contents, Assets,
    Events, Fields, Milestones, Teams, Settings and Workflows. OAuth 2.0 (authorization code +
    client credentials) against accounts.cmp.optimizely.com.
  humanURL: https://docs.developers.optimizely.com/content-marketing-platform/reference/api-reference
  baseURL: https://api.cmp.optimizely.com/v3
