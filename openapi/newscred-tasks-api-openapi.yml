        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      summary: POST /tasks/{task_id}/assets/{asset_id}/drafts
      tags:
      - Tasks
      security:
